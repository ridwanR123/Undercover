name: Build APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: mkdir -p www && cp index.html www/index.html
      - run: npm install
      - run: npx cap add android
      - run: npx cap sync android
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk Undercover.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Undercover-APK
          path: Undercover.apk
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "v${{ github.run_number }}" Undercover.apk --title "Undercover v${{ github.run_number }}" --notes "Unduh Undercover.apk, lalu install di Android."
