if(step=='reveal'){const p=S.P[S.i],last=S.i==S.P.length-1,av=(S.pool||[]).filter(n=>!S.P.some(x=>x.nm==n));
app.innerHTML=`<div class="prog">${S.P.map((x,k)=>`<i class="${k<S.i?'d':k==S.i?'n':''}"></i>`).join('')}</div><p class="s ctr">Pemain ${S.i+1} dari ${S.P.length}</p>
${!p.nm?`<div class="c ctr"><div class="em">👋</div><h2>Siapa namamu?</h2>${av.length?`<p class="s">Pilih namamu</p><div class="grid">${av.map(n=>`<div class="pc" data-p="${n}"><b class="av lg">${n[0].toUpperCase()}</b><div class="nm">${n}</div></div>`).join('')}</div><p class="s">atau tulis nama baru:</p>`:''}<input id="nmi" placeholder="Ketik namamu" maxlength="14" autocomplete="off">${S.err?'<p class="s" style="color:var(--ac)">Nama sudah dipakai, pilih nama lain.</p>':''}<button id="nb">Lanjut</button></div>`
:!S.show?`<div class="c ctr"><div class="em">🎴</div><div class="big">${p.nm}</div><p class="s">Pastikan hanya kamu yang melihat layar.</p><button id="sw">👁 Ketuk untuk lihat peran</button></div>`
:`<div class="c ctr card"><div class="em">${hid(p)?'🎴':EM[p.r]}</div>${hid(p)?'':`<span class="role r-${p.r}">${RN[p.r]}</span>`}<div class="big">${p.word}</div>${p.r=='d'?'<p class="s">Petunjukmu ada di layar diskusi.</p>':''}<p class="s">${hid(p)?'Ingat katamu dan jangan beri tahu siapa pun.':RD[p.r]}</p><button id="nx">${last?'Sembunyikan & mulai diskusi':'Sembunyikan & oper HP'}</button></div>`}`;
const $=id=>document.getElementById(id);
if(!p.nm){if(!av.length)$('nmi').focus();app.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{p.nm=b.dataset.p;render()});$('nb').onclick=()=>{const v=$('nmi').value.trim().replace(/[<>"&]/g,'');if(!v)return;if(S.P.some(x=>x.nm.toLowerCase()==v.toLowerCase())){S.err=1;return render()}p.nm=v;S.err=0;render()}}
else if(!S.show)$('sw').onclick=()=>{S.show=true;vb(30);render()};
else $('nx').onclick=()=>{S.show=false;if(!last)S.i++;else{S.step='play';S.start=pick(S.P)}render()}}
else if(step=='play'){const al=S.P.filter(p=>p.alive);
if(S.pend){const p=S.pend;app.innerHTML=`<div class="c ctr"><div class="em">🗳️</div><h2>Keluarkan ${p.nm}?</h2><button id="y">Ya, keluarkan</button><button class="g" id="n">Batal</button></div>`;document.getElementById('y').onclick=()=>{S.pend=null;elim(p)};document.getElementById('n').onclick=()=>{S.pend=null;render()};return}
if(S.mv){if(S.mv==1){app.innerHTML=`<h2 class="ctr">Siapa kamu?</h2><p class="s ctr">Ketuk namamu. Pastikan pemain lain tidak melihat layar.</p><div class="grid">${al.map(p=>`<div class="pc" data-n="${p.nm}"><b class="av lg">${p.nm[0].toUpperCase()}</b><div class="nm">${p.nm}</div></div>`).join('')}</div><button class="g" id="n">Batal</button>`;app.querySelectorAll('.pc').forEach(b=>b.onclick=()=>{S.mv=S.P.find(x=>x.nm==b.dataset.n);render()})}
else{const p=S.mv;app.innerHTML=`<div class="c ctr card"><div class="em">${hid(p)?'🎴':EM[p.r]}</div><p class="s">${p.nm}, ${hid(p)?'katamu':'perankmu'}:</p>${hid(p)?'':`<span class="role r-${p.r}">${RN[p.r]}</span>`}<div class="big">${p.word}</div><p class="s">${hid(p)?'Ingat katamu dan jangan beri tahu siapa pun.':RD[p.r]}</p><button id="n">Sembunyikan</button></div>`}
document.getElementById('n').onclick=()=>{S.mv=0;render()};return}
if(S.hv){const d=S.P.find(x=>x.r=='d'&&x.alive);app.innerHTML=S.hv==1?`<div class="c ctr"><div class="em">🔍</div><h2>Khusus ${d.nm}</h2><p class="s">Serahkan HP ke Detektif.</p><button id="y">Tampilkan petunjuk</button><button class="g" id="n">Batal</button></div>`:`<div class="c ctr card"><div class="em">🔍</div><p>Salah satu dari <b>${S.hn}</b> adalah penyusup.</p><button id="n">Tutup</button></div>`;const y=document.getElementById('y');if(y)y.onclick=()=>{S.hv=2;render()};document.getElementById('n').onclick=()=>{S.hv=0;render()};return}
app.innerHTML=`<h2>Diskusi</h2><p class="s">Setiap pemain menyebut satu petunjuk tentang katanya (tanpa menyebut katanya). Mulai dari <b>${S.start}</b>, lalu voting.</p>
<div class="grid">${S.P.map(p=>`<div class="pc ${p.alive?'':'dead'}" data-n="${p.nm}">${p.nm==S.start&&p.alive?'<span class="st">⭐ Mulai</span>':''}<b class="av lg">${p.nm[0].toUpperCase()}</b><div class="nm">${p.nm}</div><div class="tag">${p.alive?'Ketuk untuk voting':RN[p.r]}</div></div>`).join('')}</div><button class="g" id="mw">🔎 Lihat kataku</button>${S.P.some(x=>x.r=='d'&&x.alive)?'<button class="g" id="dt">🔍 Petunjuk Detektif</button>':''}<p class="tag ctr">${al.length} pemain tersisa</p>`;
document.getElementById('mw').onclick=()=>{S.mv=1;render()};const dt=document.getElementById('dt');if(dt)dt.onclick=hint;app.querySelectorAll('.pc:not(.dead)').forEach(b=>b.onclick=()=>{S.pend=S.P.find(x=>x.nm==b.dataset.n);render()})}
else if(step=='guess'){app.innerHTML=`<h2>Kesempatan terakhir Mr. White</h2><div class="c"><p>${S.cur.nm} tereliminasi. Tebak kata Warga untuk menang!</p><input id="gs" placeholder="Tebakan kata"><button id="gb">Tebak</button></div>`;
document.getElementById('gb').onclick=()=>{const v=document.getElementById('gs').value.trim().toLowerCase();v==S.pair[0].toLowerCase()?end('Mr. White menang! 🎉 Tebakannya benar.'):after()}}
else if(step=='out'){app.innerHTML=`<h2 class="ctr">${S.cur.nm} keluar</h2><div class="c ctr"><span class="role r-${S.cur.r}">${RN[S.cur.r]}</span></div><button id="ok">Lanjut</button>`;document.getElementById('ok').onclick=()=>S.cur.r=='m'?(S.step='guess',render()):after()}
else if(step=='end'){app.innerHTML=`<div class="em ctr">${/Penyusup|Mr\. White/.test(S.msg)?'🕵️':/Badut/.test(S.msg)?'🤡':'🏆'}</div><h2 class="ctr">${S.msg}</h2><div class="c"><p class="tag">Kategori: ${S.cat} · Warga: <b>${S.pair[0]}</b> · Undercover: <b>${S.pair[1]}</b></p>${S.P.map(p=>`<div class="pl" style="padding:4px 0"><span>${p.nm}</span><span class="tag">${RN[p.r]}</span></div>`).join('')}</div><button id="ed">🏠 Kembali ke Menu</button><button class="g" id="ag">Main lagi (pengaturan sama)</button>`;
document.getElementById('ag').onclick=()=>{cfg.n=cfg.prev.length;start()};document.getElementById('ed').onclick=()=>setup()}}
function elim(p){vb(150);snd(NEU);setTimeout(()=>snd(RS[p.r]),750);S.hn=null;p.alive=false;S.cur=p;S.step='out';render()}
function after(){const al=S.P.filter(p=>p.alive),bad=al.filter(p=>p.r=='u'||p.r=='m').length;
if(S.cur.r=='b')return end('Badut menang! 🤡 Kamu berhasil divoting keluar.');
if(!bad)return end('Warga menang! 🎉 Semua penyusup tereliminasi.');
if(bad>=al.length-bad)return end('Penyusup menang! 🕵️ Warga kalah jumlah.');
S.step='play';S.start=pick(al);render()}
function end(m){snd(/^Warga/.test(m)?ES.w:/^Penyusup/.test(m)?ES.u:/Badut/.test(m)?RS.b:ES.m);cfg.prev=S.P.map(p=>p.nm);S.step='end';S.msg=m;render()}
const pick=a=>{const f=a.filter(x=>x.r!='m');return R(cfg.mwf||!f.length?a:f).nm};
let AC;const snd=a=>{if(!cfg.snd)return;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();if(AC.state=='suspended')AC.resume();let t=AC.currentTime;a.forEach(([f,d,ty])=>{const o=AC.createOscillator(),g=AC.createGain();o.type=ty||'sine';o.frequency.value=f;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.25,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d+.02);t+=d*.8})}catch(e){}};
const NEU=[[220,.18,'triangle'],[165,.3,'triangle']];
const RS={w:[[300,.2,'sawtooth'],[200,.4,'sawtooth']],d:[[300,.2,'sawtooth'],[200,.4,'sawtooth']],u:[[392,.12,'square'],[523,.12,'square'],[659,.12,'square'],[784,.35,'square']],m:[[330,.15,'sawtooth'],[247,.15,'sawtooth'],[330,.15,'sawtooth'],[185,.4,'sawtooth']],b:[[600,.08],[800,.08],[600,.08],[800,.08],[1000,.25]]};
const ES={w:[[523,.12],[659,.12],[784,.12],[1047,.45]],u:[[392,.2,'sawtooth'],[311,.2,'sawtooth'],[233,.55,'sawtooth']],m:[[523,.12,'square'],[659,.12,'square'],[784,.12,'square'],[1047,.45,'square']]};
const hid=p=>cfg.hide&&(p.r=='w'||p.r=='u');
const vb=n=>{try{cfg.snd&&navigator.vibrate&&navigator.vibrate(n)}catch(e){}};
const EM={w:'🧑‍🌾',u:'🕵️',m:'👻',b:'🤡',d:'🔍'};
function hint(){const d=S.P.find(x=>x.r=='d'&&x.alive);if(!d)return;if(!S.hn){const sus=R(S.P.filter(x=>x.alive&&(x.r=='u'||x.r=='m')));const o=R(S.P.filter(x=>x.alive&&x!==sus&&x!==d));S.hn=sh([sus.nm,o.nm]).join(' atau ')}
S.hv=1;render()}
setup();
</script></body></html>
